<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="deck_style.css">
</head>

</head>
<body>
    <div class="nav-container">
        <button class="nav-button">Logout</button>
        <button class="nav-button">Swipe Deck</button>
        <button class="nav-button">My Playlist</button>
        <button class="nav-button">Trending</button>
    </div>

    <div class="main-content">
        <div class="album-container">
            <div class="album-frame">
                <img src="https://upload.wikimedia.org/wikipedia/en/4/42/Beatles_-_Abbey_Road.jpg" 
                     alt="Abbey Road Album Cover" 
                     class="album-art">
            </div>
        </div>

        <div class="song-info">
            <h2 class="song-title">Come Together</h2>
            <h3 class="artist-name">The Beatles</h3>
        </div>

        <div class="controls">
            <button class="control-button skip-button">← Skip</button>
            <button class="control-button save-button">Save →</button>
        </div>
    </div>
</body>
</html>
